name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 静态门禁。**刻意只跑能抓真缺陷的规则**（见 ruff.toml 的说明）：
  # 一次报上百条的门禁等于没有门禁 —— 没人看，于是连真问题一起忽略。
  # ---------------------------------------------------------------------------
  lint:
    name: 静态门禁（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check ruff
      #: 不装依赖也能跑（只做静态分析）⇒ 门禁比别人快，也更容易保持必过
      - name: ruff check
        run: ruff check .

  # ---------------------------------------------------------------------------
  # 测试。**零真实上游调用**：夹具用 httpx.MockTransport 覆盖全部端点。
  # 不需要 PostgreSQL（默认 SQLite）⇒ 无需 service container，跑得快。
  # ---------------------------------------------------------------------------
  test:
    name: 测试（pytest）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      #: 🔴 测试**绝不碰真实网络**（含 DNS）。若哪天有人加了一条真实调用，
      #: 它会在这里超时/失败 —— 这是有意的。
      - name: pytest
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # 启动冒烟：**证明服务起得来**。
  # ⚠️ COORDINATOR_ENABLED=0 是**必须**的 —— 协调器默认开启，
  #    而建任务是计费动作；冒烟时如果不关它，它会代替你向上游提交任务。
  #    （token 是假的，所以会 401，但那是运气不是设计。）
  # ---------------------------------------------------------------------------
  smoke:
    name: 启动冒烟（协调器关闭）
    runs-on: ubuntu-latest
    env:
      COORDINATOR_ENABLED: "0"
      SMOKE_JWT: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjQxMDI0NDQ4MDAsInVzZXIiOnsiaWQiOiIxMDAwIiwibmFtZSI6ImNpLXNtb2tlIiwiZGV2aWNlSUQiOiIxMDAwMDAwMDAwMDAwMDAwMDAifX0.Y2ktc21va2Utc2ln"
      HAILUO_TOKEN: "smoke-test-not-a-real-token"
      TASK_DB: "sqlite+pysqlite:///./smoke.db"
      PORT: "8300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: 起服务并等 /healthz
        run: |
          gunicorn -c gunicorn_conf.py "app.main:create_app()" &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8300/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8300/healthz
          curl -sf http://127.0.0.1:8300/async/v1/models | head -c 200
          # 受理必须只回一个 task_id（协调器关 ⇒ 零上游往返）
          curl -s -X POST http://127.0.0.1:8300/async/v1/images/generations \
            -H "Authorization: Bearer $SMOKE_JWT" -H 'Content-Type: application/json' \
            -d '{"model":"hailuo-i2i","prompt":"smoke","image":["https://example.com/a.png"]}' \
            | tee /tmp/accept.json
          python -c "import json;d=json.load(open('/tmp/accept.json'));assert set(d)=={'task_id'},d"
          echo "冒烟通过：服务起得来，受理契约成立"
